services:

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: cleanloop_backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app/backend
      - ./storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload


  postgres:
    image: postgis/postgis:16-3.4

    container_name: cleanloop_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: minio/minio:latest

    container_name: cleanloop_minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"


volumes:

  postgres_data:
    name: cleanloop_postgres_data

  minio_data:
    name: cleanloop_minio_data
