version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: echocrew-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-echocrew}:${POSTGRES_PASSWORD:-echocrew_pass}@db:5432/${POSTGRES_DB:-echocrew_db}
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app/backend
      - ./storage:/app/storage
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: echocrew-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: echocrew-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echocrew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echocrew_pass}
      POSTGRES_DB: ${POSTGRES_DB:-echocrew_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-09Z
    container_name: echocrew-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
